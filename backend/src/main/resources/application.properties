# backend 폴더의 .env를 읽는다(없으면 무시). OS 환경변수가 .env보다 우선한다.
spring.config.import=optional:file:.env[.properties]
server.address=127.0.0.1
server.port=${PORT:8000}
app.db.file=${DB_FILE:data/board.sqlite}
spring.sql.init.mode=always
app.jwt.secret=${JWT_SECRET:REPLACE_WITH_RANDOM_64_HEX_CHARACTERS}
app.jwt.issuer=${JWT_ISSUER:webservice-class}
app.jwt.audience=${JWT_AUDIENCE:board-api}
app.jwt.ttl=${TOKEN_TTL:90}
